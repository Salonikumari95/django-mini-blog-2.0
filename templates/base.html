<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Blog{% endblock %}</title>

    <!-- Bootstrap CSS link for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Background aur font set kar rahe hain */
        body {
            background-color: #f9f9f9;
            font-family: 'Poppins', sans-serif;
        }

        /* Footer ka design */
        footer {
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 15px 0;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Navbar ko include kar rahe hain -->
    {% include 'navbar.html' %}

    <!--Har page ka content yahan aayega -->
    <div class="container mt-4">
        {% block content %}
        <!-- Har page ka specific content is block ke andar likha jaayega -->
        {% endblock %}
    </div>

    <!-- Common footer sab page ke neeche -->
    <footer>
        <p>© 2025 My Blog | Made with Django</p>
    </footer>

    <!-- Bootstrap JS link (for navbar toggle on mobile) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
