{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
  <!-- Login form card -->
  <div class="card shadow-lg p-4 mx-auto" style="max-width: 400px;">
    <h2 class="text-center mb-4">Login </h2>

    <!-- Agar user already logged in hai -->
    {% if user.is_authenticated %}
      <p class="text-center text-success">You are already loggedIn!</p>
      <div class="text-center">
        <a href="{% url 'home' %}" class="btn btn-primary mt-3">Home Page</a>
      </div>
    {% else %}
      <!-- Login form -->
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success w-100 mt-2">Login</button>
      </form>

      <!-- Signup link -->
      <p class="text-center mt-3">
      Create a new Account <a href="{% url 'signup' %}">Signup</a>
      </p>
    {% endif %}
  </div>
</div>
{% endblock %}
